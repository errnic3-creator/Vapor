<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VAPOR - Seller Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen flex flex-col">
  <header class="glass-panel sticky top-0 z-40 border-b border-gray-800 px-6 py-4 flex items-center justify-between">
    <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-500">VAPOR SELLER</h1>
    <nav class="space-x-6 text-sm font-semibold">
      <a href="index.html" class="text-gray-400 hover:text-white">Storefront</a>
      <a href="seller.html" class="text-purple-400">Seller Dashboard</a>
    </nav>
  </header>

  <main class="max-w-7xl w-full mx-auto p-6 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="glass-panel p-6 rounded-xl text-center">
        <span class="text-xs text-gray-400 block uppercase">Active Listings</span>
        <span id="stat-listings" class="text-3xl font-black text-purple-400">0</span>
      </div>
      <div class="glass-panel p-6 rounded-xl text-center">
        <span class="text-xs text-gray-400 block uppercase">Escrow Protection</span>
        <span class="text-3xl font-black text-emerald-400">100% Guaranteed</span>
      </div>
      <div class="glass-panel p-6 rounded-xl text-center">
        <span class="text-xs text-gray-400 block uppercase">Platform Commission</span>
        <span class="text-3xl font-black text-indigo-400">0%</span>
      </div>
    </div>

    <div class="glass-panel rounded-xl p-6">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-white">Your Active Inventory</h2>
        <button id="open-modal-btn" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg text-sm font-bold">+ List New Item</button>
      </div>
      <table class="w-full text-left text-sm text-gray-300">
        <thead class="bg-gray-900/50 text-gray-400 text-xs uppercase border-b border-gray-800">
          <tr>
            <th class="p-3">Item</th>
            <th class="p-3">Category</th>
            <th class="p-3">Game</th>
            <th class="p-3">Price</th>
            <th class="p-3 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="seller-table-body"></tbody>
      </table>
    </div>
  </main>

  <div id="list-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50">
    <form id="list-item-form" class="glass-panel p-6 rounded-xl max-w-md w-full space-y-4">
      <h3 class="text-lg font-bold text-white">List Gaming Asset</h3>
      <input type="text" id="item-title" placeholder="Item Title" required class="w-full bg-gray-900 border border-gray-700 px-3 py-2 rounded text-sm text-white">
      <input type="text" id="item-game" placeholder="Game Title (e.g. Valorant)" required class="w-full bg-gray-900 border border-gray-700 px-3 py-2 rounded text-sm text-white">
      <select id="item-category" class="w-full bg-gray-900 border border-gray-700 px-3 py-2 rounded text-sm text-white">
        <option value="Skins">Skins</option>
        <option value="Accounts">Accounts</option>
        <option value="In-Game Currency">In-Game Currency</option>
        <option value="Items & Keys">Items & Keys</option>
      </select>
      <input type="number" id="item-price" placeholder="Price (PHP)" required class="w-full bg-gray-900 border border-gray-700 px-3 py-2 rounded text-sm text-white">
      <input type="url" id="item-image" placeholder="Image URL" class="w-full bg-gray-900 border border-gray-700 px-3 py-2 rounded text-sm text-white">
      <div class="flex space-x-2 pt-2">
        <button type="button" id="close-modal-btn" class="flex-1 bg-gray-800 py-2 rounded text-sm">Cancel</button>
        <button type="submit" class="flex-1 bg-purple-600 py-2 rounded text-sm font-bold">Publish Item</button>
      </div>
    </form>
  </div>
  <script src="config.js"></script>
  <script src="seller.js"></script>
</body>
</html>
