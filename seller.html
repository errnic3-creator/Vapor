<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VAPOR - Seller Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0b0e14] text-gray-100 min-h-screen flex flex-col font-sans antialiased">
  
  <header class="bg-[#121620]/90 backdrop-blur-md border-b border-gray-800/80 sticky top-0 z-40 px-6 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">VAPOR SELLER</a>
      <nav class="flex items-center space-x-6 text-sm font-semibold">
        <a href="index.html" class="text-gray-400 hover:text-white transition-colors">Storefront</a>
        <a href="seller.html" class="text-purple-400 border-b-2 border-purple-500 pb-1">Seller Dashboard</a>
        <a href="reviews.html" class="text-gray-400 hover:text-white transition-colors">Reviews</a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl w-full mx-auto p-6 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-[#121620] border border-gray-800 p-6 rounded-2xl text-center shadow-lg">
        <span class="text-xs text-gray-400 font-bold block uppercase tracking-wider">Active Listings</span>
        <span id="stat-listings" class="text-4xl font-black text-purple-400 mt-2 block">0</span>
      </div>
      <div class="bg-[#121620] border border-gray-800 p-6 rounded-2xl text-center shadow-lg">
        <span class="text-xs text-gray-400 font-bold block uppercase tracking-wider">Escrow Protection</span>
        <span class="text-3xl font-black text-emerald-400 mt-2 block">100% Guaranteed</span>
      </div>
      <div class="bg-[#121620] border border-gray-800 p-6 rounded-2xl text-center shadow-lg">
        <span class="text-xs text-gray-400 font-bold block uppercase tracking-wider">Platform Commission</span>
        <span class="text-4xl font-black text-indigo-400 mt-2 block">0%</span>
      </div>
    </div>

    <div class="bg-[#121620] border border-gray-800 rounded-2xl p-6 shadow-xl">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-xl font-bold text-white">Your Active Inventory</h2>
          <p class="text-xs text-gray-400">Manage and publish your gaming assets for sale</p>
        </div>
        <button id="open-modal-btn" class="bg-purple-600 hover:bg-purple-500 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-lg shadow-purple-600/30 transition-all">+ List New Item</button>
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-300">
          <thead class="bg-gray-900/80 text-gray-400 text-xs uppercase border-b border-gray-800">
            <tr>
              <th class="p-4 rounded-l-xl">Item</th>
              <th class="p-4">Category</th>
              <th class="p-4">Game</th>
              <th class="p-4">Price</th>
              <th class="p-4 text-right rounded-r-xl">Actions</th>
            </tr>
          </thead>
          <tbody id="seller-table-body" class="divide-y divide-gray-800/60"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div id="list-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
    <form id="list-item-form" class="bg-[#121620] border border-gray-800 p-8 rounded-2xl max-w-md w-full space-y-4 shadow-2xl">
      <h3 class="text-xl font-bold text-white">List Gaming Asset</h3>
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">TITLE</label>
        <input type="text" id="item-title" placeholder="e.g. Karambit | Fade" required class="w-full bg-gray-900/90 border border-gray-700/80 px-4 py-2.5 rounded-xl text-sm text-white focus:outline-none focus:border-purple-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">GAME TITLE</label>
        <input type="text" id="item-game" placeholder="e.g. CS2 or Valorant" required class="w-full bg-gray-900/90 border border-gray-700/80 px-4 py-2.5 rounded-xl text-sm text-white focus:outline-none focus:border-purple-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">CATEGORY</label>
        <select id="item-category" class="w-full bg-gray-900/90 border border-gray-700/80 px-4 py-2.5 rounded-xl text-sm text-white focus:outline-none focus:border-purple-500">
          <option value="Skins">Skins</option>
          <option value="Accounts">Accounts</option>
          <option value="In-Game Currency">In-Game Currency</option>
          <option value="Items & Keys">Items & Keys</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">PRICE (PHP)</label>
        <input type="number" id="item-price" placeholder="1500" required class="w-full bg-gray-900/90 border border-gray-700/80 px-4 py-2.5 rounded-xl text-sm text-white focus:outline-none focus:border-purple-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">IMAGE URL</label>
        <input type="url" id="item-image" placeholder="https://..." class="w-full bg-gray-900/90 border border-gray-700/80 px-4 py-2.5 rounded-xl text-sm text-white focus:outline-none focus:border-purple-500">
      </div>
      <div class="flex space-x-3 pt-2">
        <button type="button" id="close-modal-btn" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2.5 rounded-xl text-sm font-semibold transition-all">Cancel</button>
        <button type="submit" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white py-2.5 rounded-xl text-sm font-bold shadow-lg shadow-purple-600/30 transition-all">Publish Item</button>
      </div>
    </form>
  </div>

  <script src="config.js"></script>
  <script src="seller.js"></script>
</body>
</html>
