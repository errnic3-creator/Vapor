<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VAPOR - Reviews Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0b0e14] text-gray-100 min-h-screen flex flex-col font-sans antialiased">
  
  <header class="bg-[#121620]/90 backdrop-blur-md border-b border-gray-800/80 sticky top-0 z-40 px-6 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-500">VAPOR REVIEWS</a>
      <nav class="flex items-center space-x-6 text-sm font-semibold">
        <a href="index.html" class="text-gray-400 hover:text-white transition-colors">Storefront</a>
        <a href="seller.html" class="text-gray-400 hover:text-white transition-colors">Seller Dashboard</a>
        <a href="reviews.html" class="text-purple-400 border-b-2 border-purple-500 pb-1">Reviews</a>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl w-full mx-auto p-6 space-y-6">
    <div class="bg-[#121620] border border-gray-800 p-6 rounded-2xl flex items-center justify-between shadow-xl">
      <div>
        <h2 class="text-4xl font-black text-white" id="avg-rating">4.9 / 5.0</h2>
        <p class="text-xs text-gray-400 mt-1">Based on user experience feedback</p>
      </div>
      <button id="open-rev-modal" class="bg-purple-600 hover:bg-purple-500 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-lg shadow-purple-600/30 transition-all">Write a Review</button>
    </div>

    <div id="reviews-feed" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </main>

  <div id="review-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
    <form id="review-form" class="bg-[#121620] border border-gray-800 p-8 rounded-2xl max-w-md w-full space-y-4 shadow-2xl">
      <h3 class="text-xl font-bold text-white">Platform Review</h3>
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">RATING</label>
        <select id="rev-rating" class="w-full bg-gray-900/90 border border-gray-700/80 px-4 py-2.5 rounded-xl text-white focus:outline-none focus:border-purple-500">
          <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
          <option value="4">⭐⭐⭐⭐ (4/5)</option>
          <option value="3">⭐⭐⭐ (3/5)</option>
          <option value="2">⭐⭐ (2/5)</option>
          <option value="1">⭐ (1/5)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">FEEDBACK</label>
        <textarea id="rev-comment" placeholder="Share your experience..." required class="w-full bg-gray-900/90 border border-gray-700/80 px-4 py-2.5 rounded-xl text-sm text-white h-28 focus:outline-none focus:border-purple-500"></textarea>
      </div>
      <div class="flex space-x-3 pt-2">
        <button type="button" id="close-rev-modal" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2.5 rounded-xl text-sm font-semibold transition-all">Cancel</button>
        <button type="submit" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white py-2.5 rounded-xl text-sm font-bold shadow-lg shadow-purple-600/30 transition-all">Post Feedback</button>
      </div>
    </form>
  </div>

  <script src="config.js"></script>
  <script src="reviews.js"></script>
</body>
</html>
