<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAPOR - Authentication</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
  <div class="glass-panel w-full max-w-md p-8 rounded-2xl glow-purple border border-purple-900/40">
    <div class="text-center mb-6">
      <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-500 tracking-wider">VAPOR</h1>
      <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest">P2P Gaming Marketplace</p>
    </div>

    <div class="bg-purple-900/30 border border-purple-500/30 rounded-lg p-3 mb-6 text-center">
      <span class="text-xs text-purple-300 font-medium">⚡ New accounts receive ₱10,000.00 PHP starting virtual wallet balance!</span>
    </div>

    <div class="flex border-b border-gray-800 mb-6">
      <button id="tab-login" class="flex-1 pb-3 text-center border-b-2 border-purple-500 font-bold text-white">Sign In</button>
      <button id="tab-register" class="flex-1 pb-3 text-center border-b-2 border-transparent text-gray-400 font-bold hover:text-white">Register</button>
    </div>

    <form id="auth-form" class="space-y-4">
      <div id="username-field" class="hidden">
        <label class="block text-xs text-gray-400 uppercase font-semibold mb-1">Username</label>
        <input type="text" id="username" class="w-full bg-gray-900/80 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-purple-500" placeholder="GamerTag">
      </div>
      <div>
        <label class="block text-xs text-gray-400 uppercase font-semibold mb-1">Email</label>
        <input type="email" id="email" required class="w-full bg-gray-900/80 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-purple-500" placeholder="player@vapor.gg">
      </div>
      <div>
        <label class="block text-xs text-gray-400 uppercase font-semibold mb-1">Password</label>
        <input type="password" id="password" required class="w-full bg-gray-900/80 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-purple-500" placeholder="••••••••">
      </div>
      <button type="submit" id="submit-btn" class="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 font-bold rounded-lg hover:from-purple-500 hover:to-indigo-500 transition shadow-lg">Sign In</button>
    </form>
    <div id="auth-error" class="mt-4 text-xs text-red-400 text-center hidden"></div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
