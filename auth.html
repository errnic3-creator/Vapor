<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAPOR - Authentication</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0b0e14] text-gray-100 flex items-center justify-center min-h-screen p-4 font-sans antialiased">
  
  <div class="bg-[#121620] w-full max-w-md p-8 rounded-2xl border border-purple-500/30 shadow-2xl space-y-6">
    <div class="text-center">
      <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-500 to-indigo-400 tracking-wider">VAPOR</h1>
      <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest font-semibold">P2P Gaming Marketplace</p>
    </div>

    <div class="bg-purple-950/40 border border-purple-500/30 rounded-xl p-3 text-center">
      <span class="text-xs text-purple-300 font-semibold">⚡ New accounts receive ₱10,000.00 PHP starting virtual wallet balance!</span>
    </div>

    <div class="flex border-b border-gray-800">
      <button id="tab-login" class="flex-1 pb-3 text-center border-b-2 border-purple-500 font-bold text-white transition-all">Sign In</button>
      <button id="tab-register" class="flex-1 pb-3 text-center border-b-2 border-transparent text-gray-400 font-bold hover:text-white transition-all">Register</button>
    </div>

    <form id="auth-form" class="space-y-4">
      <div id="username-field" class="hidden">
        <label class="block text-xs text-gray-400 uppercase font-semibold mb-1">Username</label>
        <input type="text" id="username" class="w-full bg-gray-900/90 text-white border border-gray-700/80 rounded-xl px-4 py-2.5 focus:outline-none focus:border-purple-500 transition-colors" placeholder="GamerTag">
      </div>
      <div>
        <label class="block text-xs text-gray-400 uppercase font-semibold mb-1">Email</label>
        <input type="email" id="email" required class="w-full bg-gray-900/90 text-white border border-gray-700/80 rounded-xl px-4 py-2.5 focus:outline-none focus:border-purple-500 transition-colors" placeholder="player@vapor.gg">
      </div>
      <div>
        <label class="block text-xs text-gray-400 uppercase font-semibold mb-1">Password</label>
        <input type="password" id="password" required class="w-full bg-gray-900/90 text-white border border-gray-700/80 rounded-xl px-4 py-2.5 focus:outline-none focus:border-purple-500 transition-colors" placeholder="••••••••">
      </div>
      <button type="submit" id="submit-btn" class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-purple-600/30">Sign In</button>
    </form>

    <div id="auth-error" class="text-xs text-red-400 text-center font-medium hidden"></div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
