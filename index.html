<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAPOR - Storefront</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen flex flex-col">
  <header class="glass-panel sticky top-0 z-40 border-b border-gray-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-8">
      <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-500">VAPOR</h1>
      <nav class="hidden md:flex space-x-6 text-sm font-semibold">
        <a href="index.html" class="text-purple-400">Storefront</a>
        <a href="seller.html" class="text-gray-400 hover:text-white">Seller Dashboard</a>
        <a href="reviews.html" class="text-gray-400 hover:text-white">Reviews</a>
      </nav>
    </div>
    <div class="flex items-center space-x-4">
      <div class="bg-gray-900 px-3 py-1.5 rounded-lg border border-purple-500/30 flex items-center space-x-2">
        <span class="text-xs text-gray-400">Wallet:</span>
        <span id="user-balance" class="text-sm font-bold text-emerald-400">₱0.00</span>
      </div>
      <span id="user-handle" class="text-sm text-gray-300 font-semibold">Loading...</span>
      <button id="logout-btn" class="text-xs bg-red-900/40 text-red-300 px-3 py-1.5 rounded hover:bg-red-900">Logout</button>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
    <div class="glass-panel p-4 rounded-xl flex flex-wrap gap-4 items-center justify-between">
      <input type="text" id="search-input" placeholder="Search assets, skins, accounts..." class="bg-gray-900 border border-gray-700 px-4 py-2 rounded-lg text-sm w-full md:w-64 focus:outline-none focus:border-purple-500">
      
      <div class="flex items-center space-x-2 overflow-x-auto">
        <button class="cat-filter active bg-purple-600 text-xs px-3 py-2 rounded-lg font-bold" data-cat="All">All</button>
        <button class="cat-filter bg-gray-800 text-xs px-3 py-2 rounded-lg font-bold hover:bg-gray-700" data-cat="Skins">Skins</button>
        <button class="cat-filter bg-gray-800 text-xs px-3 py-2 rounded-lg font-bold hover:bg-gray-700" data-cat="Accounts">Accounts</button>
        <button class="cat-filter bg-gray-800 text-xs px-3 py-2 rounded-lg font-bold hover:bg-gray-700" data-cat="In-Game Currency">Currency</button>
        <button class="cat-filter bg-gray-800 text-xs px-3 py-2 rounded-lg font-bold hover:bg-gray-700" data-cat="Items & Keys">Items & Keys</button>
      </div>

      <div class="flex items-center space-x-3 w-full md:w-auto">
        <span class="text-xs text-gray-400">Max Price: <strong id="price-display" class="text-white">₱25,000</strong></span>
        <input type="range" id="price-range" min="50" max="25000" value="25000" class="accent-purple-500">
      </div>
    </div>

    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </main>

  <div id="chatbot-container"></div>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="chatbot.js"></script>
  <script src="app.js"></script>
</body>
</html>
