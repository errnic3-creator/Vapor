<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAPOR - Storefront</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0b0e14] text-gray-100 min-h-screen flex flex-col font-sans antialiased selection:bg-purple-500 selection:text-white">
  
  <!-- Universal Header Nav -->
  <header class="bg-[#121620]/90 backdrop-blur-md border-b border-gray-800/80 sticky top-0 z-50 px-6 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-8">
        <a href="index.html" class="flex items-center space-x-2">
          <span class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-500 to-indigo-400">VAPOR</span>
        </a>
        <nav class="hidden md:flex items-center space-x-6 text-sm font-semibold">
          <a href="index.html" class="text-purple-400 border-b-2 border-purple-500 pb-1">Storefront</a>
          <a href="seller.html" class="text-gray-400 hover:text-white transition-colors">Seller Dashboard</a>
          <a href="reviews.html" class="text-gray-400 hover:text-white transition-colors">Reviews</a>
        </nav>
      </div>
      <div class="flex items-center space-x-4">
        <div class="bg-gray-900/90 border border-purple-500/30 px-3.5 py-1.5 rounded-lg flex items-center space-x-2 shadow-inner">
          <span class="text-xs text-gray-400 font-medium">Wallet:</span>
          <span id="user-balance" class="text-sm font-bold text-emerald-400">₱0.00</span>
        </div>
        <span id="user-handle" class="text-sm font-bold text-purple-200">Loading...</span>
        <button id="logout-btn" class="text-xs bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-lg transition-all font-semibold">Logout</button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-8">
    
    <!-- Hero Banner -->
    <div class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-purple-900/40 via-indigo-900/20 to-gray-900 border border-purple-500/20 p-8 shadow-2xl">
      <div class="relative z-10 max-w-2xl space-y-3">
        <span class="bg-purple-500/20 text-purple-300 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-widest border border-purple-500/30">P2P Escrow Protection</span>
        <h1 class="text-4xl font-extrabold text-white tracking-tight sm:text-5xl">BUY. SELL. TRADE.</h1>
        <p class="text-sm text-gray-300 leading-relaxed">Discover verified game skins, accounts, and in-game currencies protected by instant smart escrow.</p>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="bg-[#121620] p-4 rounded-xl border border-gray-800/80 flex flex-wrap gap-4 items-center justify-between shadow-lg">
      <div class="relative w-full md:w-72">
        <input type="text" id="search-input" placeholder="Search assets, skins, games..." class="w-full bg-gray-900/90 border border-gray-700/80 text-white placeholder-gray-500 px-4 py-2 rounded-lg text-sm focus:outline-none focus:border-purple-500 transition-colors">
      </div>
      
      <div class="flex items-center space-x-2 overflow-x-auto pb-1 md:pb-0">
        <button class="cat-filter active bg-purple-600 text-white text-xs px-4 py-2 rounded-lg font-bold shadow-md shadow-purple-600/30" data-cat="All">All</button>
        <button class="cat-filter bg-gray-900 text-gray-300 text-xs px-4 py-2 rounded-lg font-semibold hover:bg-gray-800 hover:text-white border border-gray-800 transition-all" data-cat="Skins">Skins</button>
        <button class="cat-filter bg-gray-900 text-gray-300 text-xs px-4 py-2 rounded-lg font-semibold hover:bg-gray-800 hover:text-white border border-gray-800 transition-all" data-cat="Accounts">Accounts</button>
        <button class="cat-filter bg-gray-900 text-gray-300 text-xs px-4 py-2 rounded-lg font-semibold hover:bg-gray-800 hover:text-white border border-gray-800 transition-all" data-cat="In-Game Currency">Currency</button>
        <button class="cat-filter bg-gray-900 text-gray-300 text-xs px-4 py-2 rounded-lg font-semibold hover:bg-gray-800 hover:text-white border border-gray-800 transition-all" data-cat="Items & Keys">Items & Keys</button>
      </div>

      <div class="flex items-center space-x-3 w-full md:w-auto">
        <span class="text-xs text-gray-400 font-medium">Max Price: <strong id="price-display" class="text-purple-300 font-bold">₱25,000</strong></span>
        <input type="range" id="price-range" min="50" max="25000" value="25000" class="accent-purple-500 cursor-pointer">
      </div>
    </div>

    <!-- Product Grid -->
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </main>

  <div id="chatbot-container"></div>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="chatbot.js"></script>
  <script src="app.js"></script>
</body>
</html>
